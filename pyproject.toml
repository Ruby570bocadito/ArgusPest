[build-system]
requires      = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name        = "argos-platform"
version     = "2.0.0"
description = "Argos — Semi-Autonomous Offensive Operations Platform"
readme      = "README.md"
requires-python = ">=3.12"
license     = {text = "MIT"}
authors     = [{name = "Argos Team"}]
keywords    = ["security", "red-team", "penetration-testing", "ctf", "offensive"]

dependencies = [
    "networkx>=3.3",
    "pyyaml>=6.0.2",
    "grpcio>=1.63.0",
    "grpcio-tools>=1.63.0",
    "protobuf>=5.26.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "textual>=0.61.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "qdrant-client>=1.9.1",
    "sentence-transformers>=3.0.1",
    "torch>=2.3.0",
    "numpy>=1.26.4",
]
security = [
    "impacket>=0.12.0",
    "scapy>=2.5.0",
    "pymetasploit3>=1.0.3",
]
reporting = [
    "weasyprint>=62.3",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "ruff>=0.4.4",
]
all = [
    "argos-platform[ml,security,reporting,dev]",
]

[project.scripts]
argos = "ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "ui*", "database*", "arsenal*", "evasion*", "ctf*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli      = true
log_cli_level = "INFO"

[tool.black]
line-length    = 100
target-version = ["py312"]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.ruff.lint]
select         = ["E", "F", "W", "I", "N"]
ignore         = ["E501", "N802", "N803", "N806"]

[tool.coverage.run]
source = ["core", "api", "database", "arsenal", "evasion", "ctf"]
omit   = ["tests/*", "*/migrations/*"]
